{{- /* Preserve links to sections of the former single review. */ -}}
<script>
(() => {
  const routes = {{ site.Data.hierarchical_data_routes | jsonify | safeJS }};
  const forward = () => {
    let anchor;
    try { anchor = decodeURIComponent(window.location.hash.slice(1)); }
    catch { return; }
    if (routes[anchor]) {
      window.location.replace(routes[anchor] + window.location.search + '#' + encodeURIComponent(anchor));
    }
  };
  window.addEventListener('hashchange', forward);
  forward();
})();
</script>
