      - heading "可解性分四层" [level=2] [ref=e540]
      - paragraph [ref=e541]:
        - strong [ref=e542]: 有限模型精确可解
        - text: 意味着在所列条件下可直接验证闭式解，例如线性梯度流与平衡两层标量网络。
        - strong [ref=e543]: 特定极限渐近可解
        - text: 需要先声明哪些规模趋于无穷、哪些比值固定，例如 MP 谱和 NNGP。
        - strong [ref=e544]: 附加假设下闭合
        - text: 要说明采样与分布条件，例如新样本在线委员会机。
        - strong [ref=e545]: 机制模型或有效理论
        - text: 解释一个可检验的部分现象，例如层级链式瓶颈、Grokking 的某种时间分离与经验损失拟合。
      - paragraph [ref=e546]: 同一篇可能同时出现这四层中的几层，正文会逐步标明边界。一个漂亮的 toy model 不被用来宣称已经解决完整神经网络。
