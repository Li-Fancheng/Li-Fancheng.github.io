        - text: 。模加法输出训练历史、超参数、权重与固定划分；全部随机实验使用显式种子。浮点库、硬件与依赖版本可能造成细小差异，尤其不能把同一随机种子当成跨平台逐位一致的保证。
      - paragraph [ref=e578]: 图表脚本使用 NumPy、SciPy 与 Matplotlib，模加法无需 PyTorch 或 GPU。这里的轻量实验用来核对理论预测与观察机制；若估计统计规律，应增加种子、样本规模与误差条，并把超参数选择从测试集评价中分离。
      - heading "从这些模型到真实网络" [level=2] [ref=e579]
      - paragraph [ref=e580]: 贯穿全系列的联系是：核谱同时影响泛化和时间尺度；深度参数化会改变有效迁移率；特征学习让核与目标对齐一起变化；而记忆、延迟泛化、集体相变和幂律必须分别指定可观测量。看见相似曲线，不足以认定相同微观机制。
      - paragraph [ref=e581]: 研究入口也由此清楚：经验谱何时能代表总体谱？何种任务需要超出固定核？有限样本回用怎样破坏在线闭合？特征形成能否改变长期损失指数？计算最优拟合在哪些数据与架构区间有效？每篇结尾给出具体练习与可继续检验的问题。
