        - text: ：轻轻使组织变形，它会不会产生恢复力？要用多大力才能让它变形一点？
      - listitem [ref=e102]:
        - strong [ref=e103]: 流动性（fluidity）
        - text: ：持续受力或等待一段时间后，组织能不能重新排列、继续变形，并释放原来的应力？
