<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">T1 邻居交换的三个阶段</title><desc id="desc">A 与 B 的公共竖边缩为一个四叉点，随后 C 与 D 之间长出横边。</desc>
<rect width="960" height="300" rx="14" fill="#f1f5f9"/>
<g font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
<text x="160" y="34">A、B 接触</text><text x="480" y="34">四叉瓶颈</text><text x="800" y="34">C、D 接触</text>
<g stroke="#475569" stroke-width="3" fill="white" stroke-linejoin="round">
<rect x="45" y="60" width="230" height="190" rx="2"/><rect x="365" y="60" width="230" height="190" rx="2"/><rect x="685" y="60" width="230" height="190" rx="2"/>
<path d="M45 60L160 123L275 60M45 250L160 187L275 250" fill="none"/>
<path d="M365 60L480 155L595 60M365 250L480 155L595 250" fill="none"/>
<path d="M685 60L765 155L685 250M915 60L835 155L915 250" fill="none"/>
</g>
<g stroke="#0d9488" stroke-width="6"><path d="M160 123V187"/><path d="M765 155H835"/></g><circle cx="480" cy="155" r="6" fill="#ea580c"/>
<text x="87" y="162">A</text><text x="233" y="162">B</text><text x="160" y="94">C</text><text x="160" y="231">D</text>
<text x="407" y="162">A</text><text x="553" y="162">B</text><text x="480" y="94">C</text><text x="480" y="231">D</text>
<text x="718" y="162">A</text><text x="882" y="162">B</text><text x="800" y="94">C</text><text x="800" y="231">D</text>
<text x="320" y="162" font-size="26">→</text><text x="640" y="162" font-size="26">→</text>
<text x="480" y="283" font-size="14" fill="#475569">拓扑示意；不表示平衡形状或定量能垒</text></g></svg>
