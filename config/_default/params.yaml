# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: blue

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: '李凡成，西湖大学交叉科学中心博士生。记录统计物理、生物系统与机器学习的研究兴趣、课程笔记和阅读思考。'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    show_search: true
    blox: "navbar"
    fixed_to_top: true
    show_theme_chooser: true
    logo:
      text: "Li Fancheng"
# Site footer
footer:
  copyright:
    notice: '© {year} Li Fancheng. Licensed under {license}'
    license:
      enable: true
      allow_derivatives: false  # 允许改编作品
      allow_commercial: false   # 禁止商用

# Localization
locale:
  date_format: '2006.01.02'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
